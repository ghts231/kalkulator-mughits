<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA Muhammadiyah 1 Paciran - Calculator</title>
    <style>
        /* --- Reset & Variables --- */
        :root {
            --primary-blue: #2563eb;
            --dark-blue: #1e40af;
            --light-blue: #eff6ff;
            --bg-gradient-start: #f8fafc;
            --bg-gradient-end: #eef2ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-soft: 0 10px 30px -5px rgba(37, 99, 235, 0.1);
            --radius: 20px;
            --transition: all 0.2s ease;
            --nav-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }

        /* --- Layout Structure --- */
        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Background Animation --- */
        .bg-shape { position: absolute; border-radius: 50%; filter: blur(80px); z-index: -1; animation: float 10s infinite ease-in-out; opacity: 0.5; }
        .shape-1 { width: 300px; height: 300px; background: #dbeafe; top: 100px; left: -50px; }
        .shape-2 { width: 400px; height: 400px; background: #e0e7ff; bottom: -50px; right: -50px; animation-delay: 5s; }
        @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(20px, 40px); } }

        /* --- NAVBAR --- */
        .navbar {
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0 20px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        /* Styling Logo Gambar Navbar */
        .logo-img-nav {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 10px; /* Sudut melengkung agar elegan */
            border: 2px solid var(--primary-blue); /* Border tipis */
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.15);
            background-color: #fff;
        }

        .brand-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand-text span { color: var(--primary-blue); }

        /* --- MAIN CONTENT --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
        }

        /* --- Calculator Card --- */
        .calculator-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 420px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 0;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 520px;
        }

        /* --- Mode Tabs (Inside Card) --- */
        .card-tabs { display: flex; justify-content: center; padding: 1.5rem 1.5rem 0.5rem 1.5rem; }
        .tab-container { 
            display: flex; 
            background: var(--light-blue); 
            padding: 4px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 300px;
            margin: 0 auto;
        }
        .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; border-radius: 8px; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: var(--transition); }
        .tab-btn.active { background: white; color: var(--primary-blue); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

        /* --- Content Wrapper --- */
        .content-wrapper { padding: 1rem 1.5rem 1.5rem 1.5rem; flex: 1; position: relative; }
        .mode-section { display: none; animation: fadeIn 0.3s ease-out; }
        .mode-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- GEOMETRY STYLES --- */
        .shape-selector { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; background: #f8fafc; padding: 0.3rem; border-radius: 10px; overflow-x: auto; }
        .shape-btn { flex: 1; border: none; background: transparent; padding: 0.5rem; border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .shape-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .shape-btn.active { background: white; color: var(--primary-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .geo-input-group { margin-bottom: 1.2rem; }
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; padding: 12px 12px 12px 38px; font-size: 0.95rem; border: 2px solid var(--border-color); border-radius: 12px; outline: none; transition: var(--transition); background: #fafafa; }
        .input-wrapper input:focus { border-color: var(--primary-blue); background: white; }
        .input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 16px; height: 16px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }

        /* --- STANDARD CALCULATOR STYLES --- */
        .calc-display { background: var(--light-blue); width: 100%; height: 90px; border-radius: 16px; margin-bottom: 1.5rem; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding: 0 1.5rem; border: 1px solid rgba(37, 99, 235, 0.1); }
        .calc-history { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 4px; min-height: 1.2em; }
        .calc-current { font-size: 2rem; font-weight: 700; color: var(--primary-blue); overflow-x: auto; white-space: nowrap; width: 100%; }

        .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .key { height: 50px; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: 600; cursor: pointer; background: #f1f5f9; color: var(--text-main); transition: var(--transition); display: flex; align-items: center; justify-content: center; }
        .key:hover { background: #e2e8f0; transform: scale(0.98); }
        .key:active { transform: scale(0.95); }
        .key:focus-visible { outline: 2px solid var(--primary-blue); }
        
        .key.operator { background: #dbeafe; color: var(--primary-blue); font-size: 1.3rem; }
        .key.equal { background: var(--primary-blue); color: white; grid-column: span 2; }
        .key.equal:hover { background: var(--dark-blue); }
        .key.clear { background: #fee2e2; color: #ef4444; }

        /* --- Shared Components --- */
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .btn-calc { background: var(--primary-blue); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); margin-bottom: 1rem; }
        .btn-calc:hover { background: var(--dark-blue); transform: translateY(-1px); }

        .result-container { background: var(--light-blue); border-radius: 12px; padding: 1rem; border: 1px dashed var(--primary-blue); animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .result-val { font-weight: 700; color: var(--primary-blue); }

.main-footer {
    background: white;
    border-top: 1px solid var(--border-color);
    padding: 1.5rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.footer-brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.footer-logo-img {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border-color);
}

/* INI KUNCI UTAMANYA */
.footer-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.footer-text span {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-main);
}

.footer-year {
    font-size: 0.85rem;
    font-weight: 500;
    color: #64748b;
    margin-top: 2px;
}

.footer-subtext {
    font-size: 0.85rem;
    color: #94a3b8;
    text-align: center;
}


        /* --- Toast --- */
        .toast { position: fixed; top: 90px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #ef4444; color: white; padding: 10px 20px; border-radius: 50px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3); opacity: 0; transition: all 0.4s; z-index: 2000; display: flex; align-items: center; gap: 8px; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .navbar { height: 60px; }
            .brand-text { font-size: 1rem; }
            .calculator-card { min-height: 500px; }
        }
    </style>
</head>
<body>

    <!-- Background Decoration -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span id="toast-msg">Error</span>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="#" class="nav-brand">
            <!-- 
                CARA MENGUBAH LOGO:
                Ganti 'src' di bawah ini dengan nama file gambar Anda.
                Contoh: src="logo-ma.png" jika gambar ada di folder yang sama.
            -->
            <img src="navbarlogo.png" alt="Logo MA Muhammadiyah" class="logo-img-nav">
            <div class="brand-text">Mughits <span>Calculator</span></div>
        </a>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="calculator-card">
            
            <!-- Mode Selector -->
            <div class="card-tabs">
                <div class="tab-container">
                    <button class="tab-btn active" onclick="switchMode('geometri')">Geometri</button>
                    <button class="tab-btn" onclick="switchMode('standar')">Standar</button>
                </div>
            </div>

            <div class="content-wrapper">
                
                <!-- MODE 1: GEOMETRY -->
                <section id="mode-geometri" class="mode-section active">
                    <div class="shape-selector">
                        <button class="shape-btn active" onclick="selectShape('persegi')">
                            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>
                            <span>Persegi</span>
                        </button>
                        <button class="shape-btn" onclick="selectShape('persegipanjang')">
                            <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"></rect></svg>
                            <span>PPanjang</span>
                        </button>
                        <button class="shape-btn" onclick="selectShape('lingkaran')">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg>
                            <span>Lingkaran</span>
                        </button>
                        <button class="shape-btn" onclick="selectShape('segitiga')">
                            <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg>
                            <span>Segitiga</span>
                        </button>
                    </div>

                    <div id="geo-inputs"></div>

                    <button class="btn btn-calc" onclick="calculateGeo()">Hitung Sekarang</button>
                    
                    <div id="geo-result" class="result-container hidden">
                        <div class="result-row"><span>Keliling</span><span class="result-val" id="res-k">0</span></div>
                        <div class="result-row"><span>Luas</span><span class="result-val" id="res-l">0</span></div>
                    </div>
                </section>

                <!-- MODE 2: STANDARD -->
                <section id="mode-standar" class="mode-section">
                    <div class="calc-display">
                        <div class="calc-history" id="calc-history"></div>
                        <div class="calc-current" id="calc-current">0</div>
                    </div>

                    <div class="keypad">
                        <button class="key clear" onclick="clearCalc('AC')">AC</button>
                        <button class="key clear" onclick="clearCalc('C')">C</button>
                        <button class="key operator" onclick="appendOperator('/')">÷</button>
                        <button class="key operator" onclick="appendOperator('*')">×</button>

                        <button class="key" onclick="appendNumber('7')">7</button>
                        <button class="key" onclick="appendNumber('8')">8</button>
                        <button class="key" onclick="appendNumber('9')">9</button>
                        <button class="key operator" onclick="appendOperator('-')">-</button>

                        <button class="key" onclick="appendNumber('4')">4</button>
                        <button class="key" onclick="appendNumber('5')">5</button>
                        <button class="key" onclick="appendNumber('6')">6</button>
                        <button class="key operator" onclick="appendOperator('+')">+</button>

                        <button class="key" onclick="appendNumber('1')">1</button>
                        <button class="key" onclick="appendNumber('2')">2</button>
                        <button class="key" onclick="appendNumber('3')">3</button>
                        
                        <button class="key equal" onclick="calculateResult()">=</button>
                        
                        <button class="key" onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
                        <button class="key" onclick="appendNumber('.')">.</button>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="footer-brand">
            <img src="footerlogo.png" alt="Logo Kecil" class="footer-logo-img">
            <div class="footer-text">
                <span>MA Muhammadiyah 1 Paciran PonPes Karangasem</span>
                <div class="footer-year">Tahun Ajaran 2025/2026</div>
            </div>
        </div>
        <div class="footer-subtext">&copy; 2026 Mughits Calculator.</div>
    </footer>

    <script>
        // --- GLOBAL STATE ---
        let currentMode = 'geometri';
        let currentShape = 'persegi';

        // --- KEYBOARD EVENT LISTENER ---
        document.addEventListener('keydown', function(event) {
            // Handle Standard Calculator Keys
            if (currentMode === 'standar') {
                const key = event.key;
                if (/[0-9]/.test(key)) { appendNumber(key); return; }
                if (key === '.') { appendNumber('.'); return; }
                if (['+', '-', '*', '/'].includes(key)) { appendOperator(key); return; }
                if (key === 'Enter' || key === '=') { event.preventDefault(); calculateResult(); return; }
                if (key === 'Backspace') { event.preventDefault(); clearCalc('C'); return; }
                if (key === 'Escape') { clearCalc('AC'); return; }
            }
            
            // Handle Geometry "Enter" Key
            if (currentMode === 'geometri' && event.key === 'Enter') {
                event.preventDefault();
                calculateGeo();
            }
        });

        // --- MODE SWITCHING ---
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.querySelectorAll('.mode-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        /* =========================================
           GEOMETRY LOGIC
           ========================================= */
        const shapes = {
            persegi: [{ id: 'sisi', label: 'Panjang Sisi' }],
            persegipanjang: [{ id: 'panjang', label: 'Panjang' }, { id: 'lebar', label: 'Lebar' }],
            lingkaran: [{ id: 'jari', label: 'Jari-jari' }],
            segitiga: [{ id: 'alas', label: 'Panjang Alas' }, { id: 'tinggi', label: 'Tinggi' }]
        };

        function renderGeoInputs(shape) {
            const container = document.getElementById('geo-inputs');
            document.getElementById('geo-result').classList.add('hidden');
            container.innerHTML = '';
            
            shapes[shape].forEach(field => {
                container.innerHTML += `
                    <div class="geo-input-group">
                        <label>${field.label}</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20"></path></svg></span>
                            <input type="number" id="${field.id}" placeholder="0" step="any">
                        </div>
                    </div>
                `;
            });
        }

        function selectShape(shape) {
            currentShape = shape;
            document.querySelectorAll('.shape-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderGeoInputs(shape);
        }

        function calculateGeo() {
            let k = 0, l = 0;
            const inputs = shapes[currentShape];
            const values = {};
            let valid = true;

            inputs.forEach(inp => {
                const val = parseFloat(document.getElementById(inp.id).value);
                if(isNaN(val)) valid = false;
                values[inp.id] = val;
            });

            if(!valid) { showToast("Mohon isi semua angka dengan benar"); return; }

            switch(currentShape) {
                case 'persegi': 
                    k = 4 * values.sisi; l = values.sisi * values.sisi; break;
                case 'persegipanjang': 
                    k = 2 * (values.panjang + values.lebar); l = values.panjang * values.lebar; break;
                case 'lingkaran': 
                    k = 2 * Math.PI * values.jari; l = Math.PI * values.jari * values.jari; break;
                case 'segitiga': 
                    k = 3 * values.alas; l = 0.5 * values.alas * values.tinggi; break;
            }

            document.getElementById('res-k').innerText = Number.isInteger(k) ? k : k.toFixed(2);
            document.getElementById('res-l').innerText = Number.isInteger(l) ? l : l.toFixed(2);
            document.getElementById('geo-result').classList.remove('hidden');
        }

        renderGeoInputs('persegi');

        /* =========================================
           STANDARD CALCULATOR LOGIC
           ========================================= */
        let currentExp = '';
        let isResultDisplayed = false;

        function updateDisplay() {
            document.getElementById('calc-current').innerText = currentExp || '0';
        }

        function appendNumber(num) {
            if(isResultDisplayed) {
                currentExp = '';
                isResultDisplayed = false;
            }
            if(num === '.' && currentExp.slice(-1) === '.') return;
            currentExp += num;
            updateDisplay();
        }

        function appendOperator(op) {
            if(isResultDisplayed) isResultDisplayed = false;
            const lastChar = currentExp.slice(-1);
            if(['+','-','*','/'].includes(lastChar)) {
                currentExp = currentExp.slice(0, -1) + op;
            } else {
                currentExp += op;
            }
            updateDisplay();
        }

        function clearCalc(type) {
            if(type === 'AC') {
                currentExp = '';
                document.getElementById('calc-history').innerText = '';
            } else if (type === 'C') {
                currentExp = currentExp.toString().slice(0, -1);
            }
            updateDisplay();
        }

        function calculateResult() {
            try {
                if(!currentExp) return;
                document.getElementById('calc-history').innerText = currentExp + ' =';
                let evalString = currentExp.replace(/×/g, '*').replace(/÷/g, '/');
                const result = eval(evalString);
                let formatted = Number.isInteger(result) ? result : result.toFixed(4).replace(/\.?0+$/, '');
                currentExp = formatted.toString();
                isResultDisplayed = true;
                updateDisplay();
            } catch (e) {
                showToast("Format salah");
                currentExp = '';
                updateDisplay();
            }
        }
    </script>
</body>
</html>
